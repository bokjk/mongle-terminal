name: 버그 보고
description: 재현 가능한 문제와 기대한 동작을 알려 주세요.
title: "[버그] "
body:
  - type: markdown
    attributes:
      value: |
        보안 취약점은 공개 이슈 대신 SECURITY.md의 비공개 제보 안내를 따르세요.
        실제 연결 코드·인증 정보·Tailscale 주소·개인 터미널 출력은 첨부하지 마세요.
  - type: textarea
    id: environment
    attributes:
      label: 환경
      description: 앱 버전 또는 커밋, Windows 버전, 설치본/ZIP/개발 실행, 원격 기기와 브라우저를 적어 주세요.
      placeholder: "0.3.0 / Windows 11 x64 / 설치본 / Android 삼성 인터넷"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 순서
      description: 새 시험 세션에서도 재현할 수 있는 최소 단계를 적어 주세요.
      placeholder: "1. …\n2. …\n3. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과와 실제 결과
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 추가 근거
      description: 발생 빈도, 관련 오류, 비밀 정보를 제거한 로그나 시험 데이터 스크린샷을 첨부하세요.
  - type: checkboxes
    id: privacy
    attributes:
      label: 제출 전 확인
      options:
        - label: 기존 이슈를 확인했고 첨부 자료에 인증 정보나 개인 작업 내용이 없습니다.
          required: true
