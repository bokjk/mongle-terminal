name: 기능 제안
description: 해결하고 싶은 불편과 원하는 사용 흐름을 알려 주세요.
title: "[제안] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하고 싶은 문제
      description: 어떤 기기·작업·상황에서 불편한지 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: 원하는 사용 흐름
      description: 사용자가 무엇을 하고 어떤 결과를 보게 되는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 현재 대안과 고려할 점
      description: 시도한 방법, 관련 오픈소스 참고, 모바일·접근성·세션 유지에 미치는 영향이 있으면 알려 주세요.
  - type: checkboxes
    id: checks
    attributes:
      label: 제출 전 확인
      options:
        - label: 기존 제안을 확인했고 공유하는 내용에 개인 정보가 없습니다.
          required: true
